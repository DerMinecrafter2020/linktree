<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Cornelius Ahner – alle wichtigen Links auf einen Blick." />
  <meta name="theme-color" content="#0a0a14" />
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' https://cdn.jsdelivr.net;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    img-src 'self' data: https:;
    connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net;
    frame-ancestors 'none';
    base-uri 'self';
    form-action 'self';
    object-src 'none';
  " />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=(), payment=()" />
  <title>Cornelius Ahner · Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <main class="card">

    <header class="profile">
      <div class="avatar-wrap">
        <div class="avatar-ring"></div>
        <div class="avatar" aria-label="Profilbild">CA</div>
      </div>
      <h1 class="name">@corneliusahner</h1>
      <p class="handle">Cornelius Ahner</p>
      <p class="bio">Azubi, 21 Jahre alt</p>
    </header>

    <!-- =========================================================
         NAVIDROME PLAYER (Spotify-Style)
         =========================================================
         Erscheint nur, wenn NAVIDROME_CONFIG.enabled = true.
         Polling-Intervall siehe config.js (pollIntervalSec). -->
    <section id="navidrome-player" class="np-player idle" aria-label="Aktuell gespielter Track" hidden>
      <div class="np-cover" aria-hidden="true"></div>
      <div class="np-info">
        <div class="np-title">Verbinde mit Navidrome…</div>
        <div class="np-artist">—</div>
        <div class="np-progress" aria-hidden="true">
          <div class="np-progress-bar"></div>
        </div>
      </div>
      <div class="np-controls" aria-label="Player-Steuerung">
        <button type="button" data-np-action="previous" class="np-btn" aria-label="Vorheriger Titel">⏮</button>
        <button type="button" data-np-action="play"     class="np-btn" aria-label="Play">▶</button>
        <button type="button" data-np-action="pause"    class="np-btn" aria-label="Pause">⏸</button>
        <button type="button" data-np-action="next"     class="np-btn" aria-label="Nächster Titel">⏭</button>
      </div>
    </section>

    <nav class="links" aria-label="Wichtige Links">
      <!-- Links werden dynamisch aus Supabase / localStorage geladen -->
    </nav>

    <footer class="footer">
      <span class="dot"></span>
      <span>made with <span class="heart">♥</span> · <span class="year"></span></span>
    </footer>
  </main>

  <!-- Reihenfolge: config → supabase-client → themes → icons → app -->
  <script src="config.js"></script>
  <script src="supabase-client.js"></script>
  <script src="themes.js"></script>
  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
