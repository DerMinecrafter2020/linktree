version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: openweb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: openweb
      POSTGRES_PASSWORD: openweb
      POSTGRES_DB: openweb
    volumes:
      - openweb-postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openweb -d openweb"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openweb-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://openweb:openweb@postgres:5432/openweb
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  openweb-postgres-data:
