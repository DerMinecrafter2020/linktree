<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#000000" />
  
  <title>Seite nicht gefunden · OpenWeb</title>
  
  
  <link rel="stylesheet" href="/fonts.css" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .not-found { max-width: 520px; text-align: center; }
    .not-found h1 { font-size: clamp(48px, 12vw, 88px); margin-bottom: 4px; background: linear-gradient(135deg, var(--neon-pink), var(--neon-cyan)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .not-found h2 { font-size: clamp(20px, 5vw, 28px); margin-bottom: 12px; }
    .not-found p { color: var(--text-dim); margin-bottom: 28px; }
    .not-found .btn { display: inline-flex; }
  </style>
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>
  <main class="card not-found">
    <h1>404</h1>
    <h2>Hier ist nichts.</h2>
    <p>Der angeforderte Link existiert nicht oder wurde entfernt. Wahrscheinlich bist du nur falsch abgebogen.</p>
    <a href="/" class="btn primary">Zurück zur Startseite</a>
  </main>
</body>
</html>
