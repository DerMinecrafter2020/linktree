<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Datenschutzerklärung</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .legal-content { max-width: 800px; margin: 40px auto; padding: 20px; color: var(--text-color, #fff); }
    .legal-content h1 { font-family: 'Space Grotesk', sans-serif; font-size: 2rem; margin-bottom: 20px; }
    .legal-content h2 { font-family: 'Space Grotesk', sans-serif; font-size: 1.5rem; margin-top: 30px; margin-bottom: 10px; }
    .legal-content h3 { font-family: 'Space Grotesk', sans-serif; font-size: 1.25rem; margin-top: 20px; margin-bottom: 10px; }
    .legal-content p, .legal-content li { margin-bottom: 15px; line-height: 1.6; }
    .legal-content ul { margin-left: 20px; margin-bottom: 15px; }
    .back-link { display: inline-block; margin-bottom: 20px; color: var(--accent-color, #3b82f6); text-decoration: none; }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
