<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0f0d13" />
  
  
  
  
  <title>Admin Login · OpenWeb</title>
  
  
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <!-- Schrift Inter (lokal, css/admin-ds.css) sofort laden -->
  <link rel="preload" href="/fonts/inter/inter-latin-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/inter/inter-latin-600.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/fonts.css" />
  <link rel="stylesheet" href="/css/admin.css" />
  <link rel="stylesheet" href="/css/themes.css" />
  <link rel="stylesheet" href="/css/admin-ds.css" />
  <script src="/js/theme-init.js" data-scope="admin"></script>
</head>
<body class="login-page">

  <div class="login-card">
    <span class="login-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></span>
    <h1>Admin Login</h1>
    <p id="login-desc">Melde dich mit deiner Admin-E-Mail und deinem Passwort an.</p>

    <form id="login-form" class="form">
      <label>
        <span>E-Mail</span>
        <input name="email" type="email" autocomplete="email" required placeholder="admin@example.com" />
      </label>
      <label>
        <span>Passwort (Optional falls YubiKey)</span>
        <input name="password" type="password" autocomplete="current-password" placeholder="••••••••" />
      </label>
      <label class="row remember-me">
        <input name="remember" type="checkbox" />
        <span>Eingeloggt bleiben (30 Tage)</span>
      </label>
      <div class="form-actions">
        <button type="submit" class="btn primary">Weiter</button>
      </div>
    </form>
    
    <form id="totp-form" class="form" hidden>
      <label>
        <span>Authentifizierungscode (TOTP)</span>
        <input name="code" type="text" autocomplete="one-time-code" placeholder="123456" />
      </label>
      <div class="form-actions">
        <button type="submit" class="btn primary">Anmelden</button>
      </div>
    </form>
    
    <div id="webauthn-container" class="form-actions" style="margin-top: 1rem;" hidden>
      <button id="webauthn-btn" class="btn">🛡️ Mit YubiKey (WebAuthn) anmelden</button>
    </div>

    <p id="login-error" class="login-error"></p>
  </div>

  <script src="/js/api-client.js"></script>
  <!-- SimpleWebAuthn Browser Script -->
  <script src="https://cdn.jsdelivr.net/npm/@simplewebauthn/browser@9.0.1/dist/bundle/index.umd.min.js" integrity="sha384-9+Bm5pUMP2324xMjhRahdomA9HaTxP6JcMhbl3tUAcV2+Jiohq8/T+dGj/rx/MaM" crossorigin="anonymous"></script>
  
  <script src="/js/login.js"></script>
</body>
</html>
